name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build in the dev container image
        uses: devcontainers/ci@v0.3
        with:
            imageName: ghcr.io/${{ github.repository_owner }}/dev-containers-for-embedded-workshop
            cacheFrom: ghcr.io/${{ github.repository_owner }}/dev-containers-for-embedded-workshop
            push: never
            runCmd: |
              mkdocs build

      - name: Lint the static site
        uses: anishathalye/proof-html@v2.2.3
        with:
          directory: ./_site
          enforce_https: true
          check_favicon: true
          check_opengraph: true
          tokens: |
            {"https://github.com": "${{ secrets.GITHUB_TOKEN }}"}
          ignore_url: |
             https://fonts.gstatic.com
             https://www.linkedin.com/in/onenashev
             https://linkedin.com/in/onenashev
             https://www.linkedin.com/in/onenashev/
             https://linkedin.com/in/onenashev/
             https://www.instagram.com/asciidwarf
             https://bsky.app/profile/asciidwarf.bsky.social
             https://fosstodon.org/@onenashev
             https://calendly.com/onenashev/
             https://medium.com/@onenashev


